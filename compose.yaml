services:
  prisma-db:
    image: postgres:17.6
    environment:
      # In production: set POSTGRES_PASSWORD env var
      # In development: defaults to trust (no password needed)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
      POSTGRES_DB: odysseus-prisma
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  typesense:
    image: typesense/typesense:29.0
    ports:
      - "8108:8108"
    volumes:
      - ./data/typesense:/data
    command: 
      ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-default}"]

      
volumes:
  postgres-data: